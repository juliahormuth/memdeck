spring:
  application:
    name: memdeck-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/memdeck}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
memdeck:
  security:
    # Base64 secret (at least 32 bytes decoded), kept outside the database. No default on purpose.
    password-pepper: ${PASSWORD_PEPPER}
