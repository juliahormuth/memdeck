spring:
  application:
    name: memdeck-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/memdeck}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    # No default on purpose. Without MAIL_USERNAME no e-mail is sent.
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
memdeck:
  mail:
    from: ${MAIL_FROM:}
  security:
    # Base64 secret (at least 32 bytes decoded), kept outside the database. No default on purpose.
    password-pepper: ${PASSWORD_PEPPER}
    # Set SESSION_COOKIE_SECURE=false only if the browser rejects the cookie on http://localhost
    session-cookie-secure: ${SESSION_COOKIE_SECURE:true}
