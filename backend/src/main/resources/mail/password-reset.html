<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light">
	<title>Seu código do Memdeck</title>
</head>
<!-- Styles are inline and the layout uses tables because many mail clients ignore stylesheets and flexbox. -->
<body style="margin:0; padding:0; background-color:#deebf6; font-family:Nunito, 'Segoe UI', Arial, sans-serif;">
	<div style="display:none; max-height:0; overflow:hidden;">Use o código para criar uma nova senha.</div>
	<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#deebf6;">
		<tr>
			<td align="center" style="padding:32px 16px;">
				<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px; background-color:#ffffff; border-radius:16px;">
					<tr>
						<td align="center" style="padding:32px 32px 0;">
							<img src="cid:memdeck-logo" width="96" height="96" alt="" style="display:block; border:0;">
							<p style="margin:8px 0 0; font-size:24px; font-weight:800; color:#05315d;">Memdeck</p>
						</td>
					</tr>
					<tr>
						<td align="center" style="padding:24px 32px 0;">
							<h1 style="margin:0; font-size:20px; font-weight:800; color:#05315d;">Crie uma nova senha</h1>
							<p style="margin:8px 0 0; font-size:16px; line-height:24px; color:#2a557c;">Digite este código na tela de recuperação:</p>
						</td>
					</tr>
					<tr>
						<td style="padding:20px 32px 0;">
							<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
								<tr>
									<td align="center" style="padding:20px 8px; background-color:#f8fbfd; border:2px solid #aecde6; border-radius:14px; font-size:36px; font-weight:800; letter-spacing:8px; color:#05315d;">{{code}}</td>
								</tr>
							</table>
							<p style="margin:12px 0 0; text-align:center; font-size:14px; color:#2a557c;">O código vale por {{minutes}} minutos.</p>
						</td>
					</tr>
					<tr>
						<td style="padding:24px 32px 32px;">
							<p style="margin:0; padding-top:20px; border-top:1px solid #deebf6; text-align:center; font-size:13px; line-height:20px; color:#2a557c;">Se você não pediu esse código, ignore este e-mail. Sua senha continua a mesma.</p>
						</td>
					</tr>
				</table>
			</td>
		</tr>
	</table>
</body>
</html>
