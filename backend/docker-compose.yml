# Local development database. Credentials come from the git-ignored .env file.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-memdeck}
      POSTGRES_USER: ${DB_USER:-memdeck}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - memdeck-pgdata:/var/lib/postgresql/data

volumes:
  memdeck-pgdata:
